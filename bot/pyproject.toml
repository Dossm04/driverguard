[project]
name = "driverguard-bot"
version = "0.2.0"
description = "DriverGuard — Telegram-бот алертов координатору (aiogram 3)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7",
    "httpx>=0.27",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
