[project]
name = "driverguard-backend"
version = "0.1.0"
description = "DriverGuard backend — FastAPI, SQLAlchemy 2, PostgreSQL, MinIO"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "psycopg[binary]",
    "minio",
    "pyjwt",
    "passlib[bcrypt]",
    "python-multipart",
    "httpx",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Базовые правила + сортировка импортов
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
