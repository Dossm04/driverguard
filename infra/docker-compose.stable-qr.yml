services:
  stable-gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.stable-qr.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  stable-ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Сначала запустите START_STABLE_QR.cmd и введите ngrok Authtoken}
    command: http http://stable-gateway:8080 --url https://mothball-urgent-quaintly.ngrok-free.dev
    depends_on:
      stable-gateway:
        condition: service_healthy
